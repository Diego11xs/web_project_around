<!doctype html>
<html lang="es">
  <head>
    <!-- =========================
         CONFIGURACIÓN
    ========================== -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Around The U.S. - Proyecto 12 de TripleTen"
    />
    <meta name="author" content="Diego Granados" />
    <meta
      name="keywords"
      content="HTML, CSS, JavaScript, API, TripleTen, Sprint 12"
    />

    <title>Around The U.S.</title>

    <link rel="stylesheet" href="./pages/index.css" />
  </head>

  <body>
    <div class="page">
      <!-- =========================
           ENCABEZADO
      ========================== -->

      <header class="header">
        <div class="logo">
          <img
            class="logo__image"
            src="./images/Logo.png"
            alt="Logotipo de Around The U.S."
          />
        </div>
      </header>

      <!-- =========================
           CONTENIDO PRINCIPAL
      ========================== -->

      <main class="content">
        <!-- Perfil del usuario -->

        <section class="profile">
          <button
            class="profile__avatar-button"
            type="button"
            aria-label="Cambiar foto de perfil"
          >
            <img
              class="profile__avatar"
              src="./images/profile.png"
              alt="Foto de perfil"
            />

            <span class="profile__avatar-edit-icon" aria-hidden="true"></span>
          </button>

          <div class="profile__info">
            <div class="profile__info-container">
              <h1 class="profile__name">Jacques Cousteau</h1>

              <button
                class="profile__edit-button"
                type="button"
                aria-label="Editar perfil"
              >
                <img src="./images/editar.png" alt="" />
              </button>
            </div>

            <h2 class="profile__occupation">Explorador</h2>
          </div>

          <button
            class="profile__add-button"
            type="button"
            aria-label="Agregar un nuevo lugar"
          >
            <img src="./images/add-button.png" alt="" />
          </button>
        </section>

        <!-- Galería de tarjetas -->

        <section class="elements" aria-label="Lugares"></section>

        <!-- Plantilla de tarjeta -->

        <template id="card-template">
          <div class="elements__element">
            <button
              class="elements__delete-button"
              type="button"
              aria-label="Eliminar tarjeta"
            ></button>

            <img class="elements__image" alt="" />

            <div class="elements__title">
              <h2 class="elements__name"></h2>

              <div class="elements__like-container">
                <button
                  class="elements__like-button"
                  type="button"
                  aria-label="Me gusta"
                ></button>
              </div>
            </div>
          </div>
        </template>
      </main>

      <!-- =========================
           PIE DE PÁGINA
      ========================== -->

      <footer class="footer">
        <p class="footer__copyright">© 2026 Around The U.S.</p>
      </footer>
    </div>

    <!-- =========================
         POPUP: EDITAR PERFIL
    ========================== -->

    <div class="popup popup__profile">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar edición de perfil"
        ></button>

        <h2 class="popup__title">Editar perfil</h2>

        <form class="popup__form" novalidate>
          <input
            class="popup__input"
            id="name-input"
            name="name"
            type="text"
            placeholder="Nombre"
            required
            minlength="2"
            maxlength="40"
          />

          <span class="popup__error" id="name-input-error"></span>

          <input
            class="popup__input"
            id="occupation-input"
            name="occupation"
            type="text"
            placeholder="Acerca de mí"
            required
            minlength="2"
            maxlength="200"
          />

          <span class="popup__error" id="occupation-input-error"></span>

          <button
            class="popup__save-button popup__button_disabled"
            type="submit"
            disabled
          >
            Guardar
          </button>
        </form>
      </div>
    </div>

    <!-- =========================
     POPUP: CAMBIAR AVATAR
========================== -->

    <div class="popup popup__avatar-edit">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar cambio de avatar"
        ></button>

        <h2 class="popup__title">Cambiar foto de perfil</h2>

        <form class="popup__form popup__avatar-form" novalidate>
          <input
            class="popup__input"
            id="avatar-input"
            name="avatar"
            type="url"
            placeholder="Enlace a la imagen"
            required
          />

          <span class="popup__error" id="avatar-input-error"></span>

          <button
            class="popup__save-button popup__button_disabled"
            type="submit"
            disabled
          >
            Guardar
          </button>
        </form>
      </div>
    </div>

    <!-- =========================
         POPUP: NUEVO LUGAR
    ========================== -->

    <div class="popup popup__newplace">
      <div class="popup__container popup__container-newplace">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar formulario de nuevo lugar"
        ></button>

        <h2 class="popup__newplace-title">Nuevo lugar</h2>

        <form class="popup__form popup__newplace-form" novalidate>
          <input
            class="popup__input popup__newplace-input"
            id="newplace-input"
            name="title"
            type="text"
            placeholder="Título"
            required
            minlength="2"
            maxlength="30"
          />

          <span class="popup__error" id="newplace-input-error"></span>

          <input
            class="popup__input popup__newplace-input"
            id="newplace-url-input"
            name="link"
            type="url"
            placeholder="Enlace a la imagen"
            required
          />

          <span class="popup__error" id="newplace-url-input-error"></span>

          <button
            class="popup__save-button popup__newplace-createbtn popup__button_disabled"
            type="submit"
            disabled
          >
            Crear
          </button>
        </form>
      </div>
    </div>

    <!-- =========================
         POPUP: VISTA PREVIA
    ========================== -->

    <div class="popup popup__image-preview">
      <div class="popup__container popup__container-preview">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar vista previa"
        ></button>

        <div class="popup__image-frame">
          <img class="popup__preview-image" alt="" />
        </div>

        <p class="popup__preview-caption"></p>
      </div>
    </div>

    <!-- =========================
         POPUP: CONFIRMAR ELIMINACIÓN
    ========================== -->

    <div class="popup popup__confirmation">
      <div class="popup__container">
        <button
          class="popup__close-button"
          type="button"
          aria-label="Cerrar confirmación"
        ></button>

        <h2 class="popup__title">¿Estás seguro?</h2>

        <form class="popup__form">
          <button class="popup__save-button" type="submit">Sí</button>
        </form>
      </div>
    </div>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
